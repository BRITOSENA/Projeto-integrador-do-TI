body,button,.rb-caixa{font-family:"MinecraftPT","VT323","Courier New",monospace}
body{font-size:20px}
.titulo{font-size:48px}
.rb-fundo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px}
.rb-fundo[hidden]{display:none}
.rb-caixa{background:#c6c6c6;border:4px solid #000;box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #555;width:min(520px,100%);max-height:86vh;overflow:auto;padding:14px;color:#3f3f3f}
.rb-topo{display:flex;justify-content:space-between;align-items:center}
.rb-topo h2{margin:0;font-size:24px;font-weight:normal;display:flex;align-items:center;gap:10px}
.rb-topo h2 svg{width:36px;height:36px;display:block}
.livro{display:grid;place-items:center}
.livro svg{width:78%;height:78%;display:block;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
.rb-fechar{font-family:inherit;font-size:20px;background:#8b8b8b;color:#fff;border:3px solid #000;box-shadow:inset 2px 2px 0 #bbb,inset -2px -2px 0 #555;width:34px;height:34px;cursor:pointer;padding:0}
.rb-dica{margin:6px 0 12px;font-size:16px;line-height:1.3}
.rb-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rb-rec{font:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center;background:#b0b0b0;border:2px solid #7a7a7a;padding:8px}
.rb-grade{display:grid;grid-template-columns:repeat(3,28px);gap:2px}
.rb-s{width:28px;height:28px;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;box-sizing:border-box;padding:1px;display:flex;align-items:center;justify-content:center}
.rb-s svg{width:100%;height:100%;display:block}
.rb-rec:hover{background:#c9c9e0}
.rb-seta{width:27px;height:15px;flex:none}
.rb-seta svg{width:100%;height:100%;display:block}
.rb-s.res{width:34px;height:34px}
</style>

<body data-estado="trancado">
<main>
  <h1 class="titulo">Cofre</h1>

  <div class="painel">
    <div class="topo">
      <h2>Crafting</h2>
      <div class="status"><span id="estado">Cofre: trancado</span></div>
    </div>

    <form id="form" autocomplete="off">
      <div class="craft">
        <button class="livro" id="livro" type="button" aria-label="Ajuda"></button>
        <div class="grade" id="grade">
        </div>
        <div class="seta" aria-hidden="true"></div>
        <button class="slot saida" id="saida" type="button" aria-label="Pegar a chave" disabled></button>
      </div>
    </form>

    <h2>Inventory</h2>
    <div class="inv" id="inv"></div>
    <div class="inv" id="hotbar"></div>
  </div>

  <div class="botoes">
    <button class="mc-btn" id="craftar" type="submit" form="form">Craftar</button>
    <button class="mc-btn pequeno" id="limpar" type="button">Limpar</button>
  </div>
  <p id="msg" aria-live="polite">Clique num item do inventário e depois num espaço da grade para colocá-lo. Monte a receita e clique em Craftar.</p>
</main>

<div class="flutuante" id="flutuante" aria-hidden="true"></div>

<div class="rb-fundo" id="rbFundo" hidden>
  <div class="rb-caixa" role="dialog" aria-label="Livro de receitas">
    <div class="rb-topo"><h2><span id="rbIcone"></span>Recipe Book</h2><button type="button" class="rb-fechar" id="rbFechar" aria-label="Fechar">X</button></div>
    <p class="rb-dica">Clique numa receita para colocá-la na grade. Só uma delas gera a chave do cofre.</p>
    <div class="rb-lista" id="rbLista"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  /* ---------- Firebase ---------- */
  const db = getDatabase(initializeApp({
    databaseURL: "https://cofre-2ad5c-default-rtdb.firebaseio.com",
    projectId: "cofre-2ad5c"
  }));

  /* ---------- Configuração (mude aqui) ---------- */
  // Receitas que abrem o cofre. Letras: T tábua, G graveto, P pedregulho, F ferro, O ouro, D diamante.
  // A grade é lida de cima para baixo, da esquerda para a direita; "-" é espaço vazio.
  const RECEITAS = ["TT--G--G-", "-TT-G--G-"];   // enxada de madeira (normal e espelhada)
  // Receita que TRANCA o cofre: machado de diamante (normal e espelhado)
  const RECEITAS_TRANCAR = ["DD-DG--G-", "-DDGD--G-"];
  const TEMPO_CHAVE = 55000;                       // quanto tempo a chave dura
  const MAX_ERROS = 3, TEMPO_BLOQUEIO = 30000;     // erros seguidos e tempo de bloqueio

  /* ---------- Utilidades ---------- */
  const $ = id => document.getElementById(id);
  const CHAVE = '<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="#f5c518" fill-rule="evenodd" d="M1 5h5v5H1zM2 6h3v3H2z"/><path fill="#f5c518" d="M6 7h9v2H6zM11 9h2v3h-2zM14 9h1v2h-1z"/></svg>';
  const vazios = n => '<div class="slot"></div>'.repeat(n);
  const msg = (texto, tipo = "") => { $("msg").textContent = texto; $("msg").className = tipo; };

  $("hotbar").innerHTML = vazios(9);

  /* ---------- Som de clique ---------- */
  const SOM = new Audio("data:audio/mpeg;base64,SUQzBAAAAAABB1RQRTEAAAAPAAADU291bmQgTGlicmFyeQBUSVQyAAAAQQAAA0J1dHRvbi9QbGF0ZSBDbGljayAoTWluZWNyYWZ0IFNvdW5kKSAtIFNvdW5kIEVmZmVjdCBmb3IgZWRpdGluZwBUU1NFAAAADwAAA0xhdmY2MC4xNi4xMDAAAAAAAAAAAAAAAP/7UMAAAAAAAAAAAAAAAAAAAAAAAEluZm8AAAAPAAAACwAACcoAKioqKioqKioqPz8/Pz8/Pz8/VVVVVVVVVVVVampqampqampqf39/f39/f39/lZWVlZWVlZWVqqqqqqqqqqqqv7+/v7+/v7+/1dXV1dXV1dXV6urq6urq6urq////////////AAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAACQELwAAAAAAAAnKQRqtWwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/+1DEAAAGnAEHtBEAId+zYVcegAAABwlJ77RwkuE4PnwcdB8+GMHwcOI8oCAJ1HOsH+XB8EAQ8EOCAITP+X8EP/y4f///+IAQMgACAAAEBQRnqIK9bhKVVLlAsBzxlp6qVgRBURBFBYNah2mbV0kc98a8JUIOpJGLbKISTOkmxPNU6ar9S0Y/urih8SPLKj/v5+eu+nq4WyIn1uq+Pu+r9f+62rj+3//ru94iPe0vqJhMZFQlLUz8yhkkW//Qj/9AdcPdeff+fPfRAAEdaCNA//tSxAcAC7TNPzj0gAGFrGe3nlAF/1gk0TSVOo4I3uhqdYtqitk5ajdtht6izd+e/Z3G8TV2sUIEqjTd30uYlCE9VPIacpvrI55+CPekhzMVQ/arM6NHMTg5SEliKZb/zVH+jKASzTRGFIkAQLs6WUrW4nLITuKsIM3WFd3UjjFAUaNESCQfBRpzFUg0ooDr9irRKFkoLFKceYo3sd6GZLZLu1Jqo1X9//9LtKT11evf+23nRLftV/3MxiDzJ/quq4XQE1LdArxjxLiSaSgvT/v/+1LEBYALdIM5p7BlQYOb5nKwYAAX4yCbiwJ1w78giUeNpicYEsYOJHIQbOk6kCsKYaDdhaO61ynSSHkwkxQTFXDA8XUQE6xNDaRN9yjaFuVG3oYj+/FadC1rMh/FXNTEL2jlnFgGOSwM2dGAWFLnTXy77vNedh23fk8GSx9qWxfjRpEaT7kCECUlo9rd8krXb1nnd3UWKTti6d4upxt//ZXx39/xLfv/evs67fbf//IorE2er0icnWoyf/ABhKbitvPdD1k1hkZxBQhwhAYwzP/7UsQFAAudY4H4+QARb5Su/56wBOYCAQCAoFpjpSA1tlNpRbzF/Nw4J60AD0AN0tGbvImQMiaToKs8cb0jbqtN3mjKQWmvT2oFxlIabX/6mQ+v/9S3p+61Lv//p6aeh////+ZuUdg/0/sHBsYV2tF3oeWGEKEpFSxqZSnMxK5Vo5CsHYQoHKCXMHzVt/kQd+kkTWnWt/+ahvtbHddXfpPdfNfbnW06anY6A6VDX1srBUFn8FULd8sDQNB3zvaJl/2A0HVjZIMAAABYABeCKaoR//tSxAaAC/yNVeeZDkF6E+n08woYL0qqnqgZ10gF2um6OwApjbIhZNRogmd2SaY4CQ+ilkR3ZtNFMVr+U+PrVijpoeOSoLEgobKvLNGzzhYL7Eua5dZ2lC3MsTUWDoU/2/U8XfcmUi3VkjIIAQBSnF+LkpThPNxuceUqYLGZKZVClPxJZUL2Yq+jCnKzox/I1GZfPs6XUj3y1buOZ1K6v8KEjDosI0DGiIk5byZJwJPdYbUxhArviFIaRJf/x0VPBpLyAclyyiGkY0ERBpJIu4L/+1LEBQALsSlJ5gxTgXEWZ7TzDgnkqwPmRSZix4OT8YA2WE+pdXxo1rvxvRpGhjKEHFBBLBSspWxjpGTk23lCmKmqeplst+pcsHDctpm1Oistf3avZRi27eqWRvFPY5ev/zuG0l1MUWbziJYILTSeA7kFHFxLqn0ohzGi2V6+XlpWrpRIxjYodJEeJ2ZrDbSDwC28gFV1buuWvnWQUolsgyN0mbut+4U2ZKJ+5v9N9fjeSXhx2sTe66j7BNrFY2p8a1/5cgZgAAQiApEKlwRJGv/7UsQGAAokuSUEmHJA94wjGDEOCJKqDwpgFpComUbFMEwqUD4BJEiyJqrIs4CJE/tRRz6qxW9W24zbVVmzVbs30lJvQVOgqWOqLCXBVkVDICDrR7iUCsav9gAapWpj6CZu+u5M5MqlBiYU3AaS01ImlUTQqgJ6DYQDTjiT0xf4ZPSNah434dVmb9sOUlXXI8r6/2KyS+yRMKCEhYwEKbqs1XWMbBm+K6XgUcDaxy//9gJBcgoKNx+aMld7Y3F3hPWH/3+HVNgrgreX/8L8vhHY//tSxByDCQg9AACAZgkjndUEMI4JsBP+Cu/IK/oK7/xBQX+ihoCgnEDqwUMCDoZMrKFjk/Z+TWTzJlDA6joasFBAg4QWMKAQwUKEDiB1ZQwYGhkfrZf+f/k1kdDJlDAwaOhqwUECcSqSrhq/9NVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/+1LEMYPAAAGkAAAAIAAANIAAAARVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/7UsSPg8AAAaQAAAAgAAA0gAAABFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//tSxKGDwAABpAAAACAAADSAAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=");
  SOM.preload = "auto";
  function tocarSom() { try { SOM.currentTime = 0; SOM.play().catch(() => {}); } catch (e) {} }
  $("craftar").addEventListener("click", tocarSom);
  $("limpar").addEventListener("click", tocarSom);
  $("livro").addEventListener("click", tocarSom);

  /* ---------- Itens (pixel art 8x8) ---------- */
  function icone(mapa, cores) {
    let r = "";
    mapa.forEach((linha, y) => [...linha].forEach((c, x) => {
      if (cores[c]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${cores[c]}"/>`;
    }));
    return `<svg viewBox="0 0 ${mapa[0].length} ${mapa.length}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
  }
  const LINGOTE = ["........","..hhhhh.",".hwwwwwd",".wwwwwdd","..dddd..","........","........","........"];
  const ITENS = {
    T: { nome: "Tábua de carvalho", svg: icone(["bbbbbbbb","aaaaaaaa","aaaaaaaa","bbbbbbbb","aaaaaaaa","aaaaaaaa","aaaaaaaa","bbbbbbbb"], { a: "#b8945f", b: "#8f6b3a" }) },
    G: { nome: "Graveto", svg: icone([".......s","......ss",".....ss.","....ss..","...ss...","..ss....",".ss.....","ss......"], { s: "#8a5a2b" }) },
    P: { nome: "Pedregulho", svg: icone(["hhGhhhGh","hggghggg","GgghhGgh","ghhggghh","hGgghGgg","gghhgghG","hggGhhgg","GhhggGhh"], { g: "#7d7d7d", G: "#5f5f5f", h: "#9a9a9a" }) },
    F: { nome: "Lingote de ferro", svg: icone(LINGOTE, { h: "#f0f0f0", w: "#d8d8d8", d: "#a8a8a8" }) },
    O: { nome: "Lingote de ouro", svg: icone(LINGOTE, { h: "#fff3a0", w: "#f5c518", d: "#c9990a" }) },
    D: { nome: "Diamante", svg: icone(["..hhhh..",".hwwwwh.","hwwwwwwd",".dwwwwd.","..dwwd..","...dd...","........","........"], { h: "#b9f7f2", w: "#4fe0d0", d: "#1aa59a" }) }
  };
  const codigos = Object.keys(ITENS);

  // Inventário: os itens ficam nos primeiros espaços (estoque infinito)
  $("inv").innerHTML = codigos.map(c =>
    `<button type="button" class="slot item" data-codigo="${c}" data-nome="${ITENS[c].nome}" aria-label="${ITENS[c].nome}">${ITENS[c].svg}</button>`
  ).join("") + vazios(27 - codigos.length);

  /* ---------- Mão: o item que você está segurando ---------- */
  let segurando = null;

  function atualizarMao() {
    $("flutuante").innerHTML = segurando ? ITENS[segurando].svg : "";
    $("flutuante").style.display = segurando ? "block" : "none";
    $("inv").querySelectorAll(".item").forEach(b => b.classList.toggle("sel", b.dataset.codigo === segurando));
  }
  function moverMao(ev) {
    $("flutuante").style.transform = `translate(${ev.clientX + 8}px, ${ev.clientY + 8}px)`;
  }

  $("inv").addEventListener("click", ev => {
    const b = ev.target.closest(".item");
    if (!b) return;
    segurando = segurando === b.dataset.codigo ? null : b.dataset.codigo;
    atualizarMao();
    moverMao(ev);
  });
  document.addEventListener("pointermove", ev => { if (segurando) moverMao(ev); });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && segurando) { segurando = null; atualizarMao(); }
  });

  /* ---------- Grade de craft: a senha é a receita ---------- */
  const celulas = Array(9).fill("");   // código do item (ou vazio) em cada espaço

  $("grade").innerHTML = Array.from({ length: 9 }, (_, i) =>
    `<button type="button" class="slot" data-i="${i}"></button>`).join("");
  const espacos = [...$("grade").querySelectorAll(".slot")];

  function desenhar() {
    espacos.forEach((b, i) => {
      const c = celulas[i];
      if (b.dataset.c !== c) {
        b.dataset.c = c;
        b.innerHTML = c ? ITENS[c].svg : "";
        if (c) b.dataset.nome = ITENS[c].nome; else delete b.dataset.nome;
      }
      b.setAttribute("aria-label", "Espaço " + (i + 1) + (c ? ": " + ITENS[c].nome : ", vazio"));
    });
  }

  function limparGrade() {
    celulas.fill("");
    desenhar();
  }

  $("grade").addEventListener("click", ev => {
    const b = ev.target.closest(".slot");
    if (!b) return;
    const i = Number(b.dataset.i);
    // Com um item na mão: coloca (ou tira, se já era o mesmo). Sem nada na mão: esvazia o espaço.
    celulas[i] = segurando ? (celulas[i] === segurando ? "" : segurando) : "";
    desenhar();
  });

  $("limpar").addEventListener("click", limparGrade);

  desenhar();

  /* ---------- Livrinho (icone do botao verde e do titulo do livro) ---------- */
  const LIVRINHO = icone([
    "oooooooooo",
    "oddcccccco",
    "oddccyycco",
    "oddcyyyyco",
    "oddccyycco",
    "oddcccccco",
    "oddcccccco",
    "oddcccccco",
    "oppppppppo",
    "oooooooooo"
  ], { o: "#2b1608", d: "#6b3410", c: "#b5651d", y: "#f5c518", p: "#f3ead2" });
  $("livro").innerHTML = LIVRINHO;
  $("rbIcone").innerHTML = LIVRINHO;
  const SETA = icone(["......#..","......##.","#########","......##.","......#.."], { "#": "#555555" });

  /* ---------- Livro de receitas (só uma abre o cofre; o livro não diz qual) ---------- */
  const FERR = {
    pick:   ["..mmmm..",".mm..mm.","mm.s..mm","m.s....m",".s......","s.......","........","........"],
    axe:    ["...mmm..","..mmmm..","...smm..","..s.....",".s......","s.......","........","........"],
    sword:  ["......mm",".....mmm","....mm..","...mm...","s.mm....",".ss.....",".s.s....","s......."],
    hoe:    ["..mmm...",".m..s...","...s....","..s.....",".s......","s.......","........","........"],
    shovel: ["....mm..","...mmmm.","...mmmm.","....ms..","...s....","..s.....",".s......","s......."]
  };
  const FORMAS = {
    pick: "MMM-G--G-", axe: "MM-MG--G-", sword: "-M--M--G-", hoe: "MM--G--G-", shovel: "-M--G--G-"
  };
  const MATERIAIS = { T: "#b8945f", P: "#7d7d7d", F: "#d8d8d8", O: "#f5c518", D: "#4fe0d0" };
  // A receita da chave é a enxada de madeira, a mesma de RECEITAS. As outras são só enfeite.
  const LIVRO = [
    ["pick", "T"], ["axe", "T"], ["sword", "T"], ["shovel", "P"],
    ["hoe", "T"],
    ["pick", "P"], ["sword", "F"], ["hoe", "P"], ["axe", "D"], ["shovel", "O"]
  ];
  $("rbLista").innerHTML = LIVRO.map(([tipo, mat]) => {
    const forma = [...FORMAS[tipo]].map(c => c === "M" ? mat : c).join("");
    const slots = [...forma].map(k => {
      return '<div class="rb-s">' + (k === "-" ? "" : ITENS[k].svg) + '</div>';
    }).join("");
    const res = icone(FERR[tipo], { m: MATERIAIS[mat], s: "#8a5a2b" });
    return '<button type="button" class="rb-rec" data-r="' + forma + '"><div class="rb-grade">' + slots + '</div><div class="rb-seta">' + SETA + '</div><div class="rb-s res">' + res + '</div></button>';
  }).join("");

  const abrirLivro = () => { $("rbFundo").hidden = false; };
  const fecharLivro = () => { $("rbFundo").hidden = true; };
  $("livro").addEventListener("click", abrirLivro);
  // Clicar numa receita do livro coloca os itens na grade (como no Minecraft)
  $("rbLista").addEventListener("click", ev => {
    const b = ev.target.closest(".rb-rec");
    if (!b) return;
    [...b.dataset.r].forEach((c, i) => { celulas[i] = c === "-" ? "" : c; });
    desenhar();
    fecharLivro();
    msg("Receita colocada na grade. Clique em Craftar para testar.");
  });
  $("rbFechar").addEventListener("click", fecharLivro);
  $("rbFundo").addEventListener("click", ev => { if (ev.target === $("rbFundo")) fecharLivro(); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") fecharLivro(); });

  /* ---------- Chave (resultado do craft e inventário) ---------- */
  let chave = "nenhuma";   // "nenhuma" | "saida" | "inventario"
  let tChave;

  function renderChave() {
    const saida = $("saida");
    saida.innerHTML = chave === "saida" ? CHAVE : "";
    saida.disabled = chave !== "saida";
    if (chave === "saida") saida.dataset.nome = "Chave do Cofre"; else delete saida.dataset.nome;

    $("hotbar").firstElementChild.innerHTML = chave === "inventario"
      ? '<button type="button" class="item-chave" data-nome="Chave do Cofre" aria-label="Usar a chave para abrir o cofre">' + CHAVE + '</button>'
      : "";
  }

  function perderChave(texto) {
    clearTimeout(tChave);
    chave = "nenhuma";
    renderChave();
    if (texto) msg(texto, "erro");
  }

  $("saida").addEventListener("click", () => {
    if (chave !== "saida") return;
    chave = "inventario";
    renderChave();
    msg("Chave no inventário. Clique nela para abrir o cofre.", "ok");
  });

  /* ---------- Estado do cofre (o Firebase liga o site ao ESP32) ---------- */
  function aplicarEstado(e) {
    document.body.dataset.estado = e;
    $("estado").textContent = "Cofre: " + e;
  }

  function definirEstado(e) {
    aplicarEstado(e);                                   // funciona mesmo sem o ESP32
    set(ref(db, "cofre/estado"), e).catch(() => {});    // o ESP32 lê daqui
  }

  onValue(ref(db, "cofre/estado"), snap => {
    const e = snap.val();
    if (e !== "aberto" && e !== "trancado") return;
    aplicarEstado(e);
  });

  /* ---------- Craftar: confere a receita aqui no site ---------- */
  // Erros e bloqueio ficam guardados no navegador: atualizar a página não zera nada
  const ler = k => { try { return Number(localStorage.getItem(k)) || 0; } catch (e) { return 0; } };
  const guardar = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
  let erros = ler("cofre_erros"), bloqueadoAte = ler("cofre_bloqueio");
  let tContagem;

  // Mostra "Aguarde X segundos" contando para trás (só mexe na mensagem se ela for a do bloqueio)
  function contagem() {
    clearInterval(tContagem);
    const tick = () => {
      const r = Math.ceil((bloqueadoAte - Date.now()) / 1000);
      const dela = $("msg").textContent.startsWith("Muitas tentativas");
      if (r > 0) { if (dela) msg("Muitas tentativas. Aguarde " + r + " segundos.", "erro"); return; }
      clearInterval(tContagem);
      guardar("cofre_bloqueio", 0);
      if (dela) msg("Você já pode tentar de novo.", "ok");
    };
    tick();
    tContagem = setInterval(tick, 1000);
  }
  if (Date.now() < bloqueadoAte) { msg("Muitas tentativas. Aguarde um pouco.", "erro"); contagem(); }
  else guardar("cofre_bloqueio", 0);

  $("form").addEventListener("submit", ev => {
    ev.preventDefault();
    if (Date.now() < bloqueadoAte) { msg("Muitas tentativas. Aguarde um pouco.", "erro"); contagem(); return; }
    if (!celulas.some(Boolean)) { msg("Coloque pelo menos um item na grade.", "erro"); return; }

    // Cada espaço vira a letra do item e os vazios viram "-": T T _ / _ G _ / _ G _ vira "TT--G--G-"
    const receita = celulas.map(c => c || "-").join("");

    if (RECEITAS_TRANCAR.includes(receita)) {
      erros = 0; guardar("cofre_erros", 0);
      limparGrade();
      definirEstado("trancado");
      msg("Cofre trancado!", "ok");
      return;
    }

    if (chave !== "nenhuma" && RECEITAS.includes(receita)) { msg("Você já tem uma chave. Use ela no inventário.", "erro"); return; }

    if (RECEITAS.includes(receita)) {
      erros = 0; guardar("cofre_erros", 0);
      limparGrade();
      chave = "saida";
      renderChave();
      clearTimeout(tChave);
      tChave = setTimeout(() => perderChave("A chave quebrou. Craft outra com a receita."), TEMPO_CHAVE);
      msg("Receita certa! Pegue a chave no resultado.", "ok");
    } else {
      erros++; guardar("cofre_erros", erros);
      $("grade").classList.add("tremer");
      setTimeout(() => $("grade").classList.remove("tremer"), 300);
      if (erros >= MAX_ERROS) {
        erros = 0; guardar("cofre_erros", 0);
        bloqueadoAte = Date.now() + TEMPO_BLOQUEIO;
        guardar("cofre_bloqueio", bloqueadoAte);
        msg("Muitas tentativas. Aguarde 30 segundos.", "erro");
        contagem();
      } else {
        msg("Receita errada. Nada foi craftado.", "erro");
      }
    }
  });

  /* ---------- Usar a chave: abre o cofre ---------- */
  $("hotbar").addEventListener("click", ev => {
    if (!ev.target.closest(".item-chave")) return;
    perderChave();
    definirEstado("aberto");
    msg("Cofre aberto! A chave foi usada.", "ok");
  });
</script>
<script>
  // Se o estilo.css não carregar, mostra um aviso vermelho no topo da página
  window.addEventListener("load", function () {
    if (getComputedStyle(document.documentElement).getPropertyValue("--s").trim()) return;
    var a = document.createElement("div");
    a.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;padding:12px;background:#b00020;color:#fff;font:16px Arial,sans-serif";
    a.textContent = "O arquivo estilo.css não foi encontrado. Coloque-o na MESMA pasta do cofre.html, com o nome exato estilo.css, ou use o cofre-completo.html.";
    document.body.prepend(a);
  });
</script>
</body>
</html>
