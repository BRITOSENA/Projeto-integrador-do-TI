<!DOCTYPE html>

<html lang="pt-BR">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Sistema de cofre digital com senha e controle de acesso."
>

<!-- Impede que o navegador envie a URL completa como referência -->
<meta
    name="referrer"
    content="no-referrer"
>

<!--
    Content Security Policy básica.

    Permite:
    - HTML
    - CSS local
    - JavaScript local
    - imagens locais
    - conexões apenas para o próprio site

    IMPORTANTE:
    Como seu HTML usa onclick="...", o 'unsafe-inline'
    é necessário nesta versão.
-->
<meta
    http-equiv="Content-Security-Policy"
    content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self';
        connect-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
    "
>

<!-- Tenta transformar requisições HTTP em HTTPS -->
<meta
    http-equiv="Content-Security-Policy"
    content="upgrade-insecure-requests"
>

<title>Cofre Digital</title>

<link
    rel="stylesheet"
    href="style.css"
>
```

</head>

<body>

```
<main
    class="cofre"
    id="cofre"
    aria-label="Cofre digital"
>


    <!-- ==========================================
         INTERIOR DO COFRE
    =========================================== -->

    <div
        class="interior"
        aria-hidden="true"
    >

        <div class="interior-conteudo">

            <h2>
                COFRE ABERTO
            </h2>

            <div class="conteudo">
                CONTEÚDO PROTEGIDO
            </div>

        </div>

    </div>


    <!-- ==========================================
         PORTA DO COFRE
    =========================================== -->

    <div
        class="porta"
        aria-hidden="true"
    >

        <div class="logo">
            SAFE
        </div>


        <div class="roda">

            <div class="roda-centro">
                🔒
            </div>

        </div>


        <div class="parafuso parafuso-1"></div>

        <div class="parafuso parafuso-2"></div>

        <div class="parafuso parafuso-3"></div>

        <div class="parafuso parafuso-4"></div>

    </div>


    <!-- ==========================================
         PAINEL
    =========================================== -->

    <section
        class="painel"
        aria-labelledby="titulo-cofre"
    >

        <h1 id="titulo-cofre">
            COFRE DIGITAL
        </h1>


        <!-- LED -->

        <div
            class="led"
            id="led"
            role="status"
            aria-label="Status do cofre"
        ></div>


        <!-- DISPLAY -->

        <div
            class="display"
            id="display"
            role="status"
            aria-live="polite"
            aria-label="Display da senha"
        >
            ----
        </div>


        <!-- ======================================
             TECLADO VISUAL
        ======================================= -->

        <div
            class="teclado"
            role="group"
            aria-label="Teclado do cofre"
        >

            <button
                type="button"
                onclick="digitar('1')"
                aria-label="Número 1"
            >
                1
            </button>


            <button
                type="button"
                onclick="digitar('2')"
                aria-label="Número 2"
            >
                2
            </button>


            <button
                type="button"
                onclick="digitar('3')"
                aria-label="Número 3"
            >
                3
            </button>


            <button
                type="button"
                onclick="digitar('4')"
                aria-label="Número 4"
            >
                4
            </button>


            <button
                type="button"
                onclick="digitar('5')"
                aria-label="Número 5"
            >
                5
            </button>


            <button
                type="button"
                onclick="digitar('6')"
                aria-label="Número 6"
            >
                6
            </button>


            <button
                type="button"
                onclick="digitar('7')"
                aria-label="Número 7"
            >
                7
            </button>


            <button
                type="button"
                onclick="digitar('8')"
                aria-label="Número 8"
            >
                8
            </button>


            <button
                type="button"
                onclick="digitar('9')"
                aria-label="Número 9"
            >
                9
            </button>


            <button
                type="button"
                class="limpar"
                onclick="limpar()"
                aria-label="Limpar senha"
            >
                C
            </button>


            <button
                type="button"
                onclick="digitar('0')"
                aria-label="Número 0"
            >
                0
            </button>


            <button
                type="button"
                class="confirmar"
                onclick="confirmar()"
                aria-label="Confirmar senha"
            >
                ✓
            </button>

        </div>


        <!-- ======================================
             TENTATIVAS
        ======================================= -->

        <div
            class="tentativas"
            aria-live="polite"
        >

            TENTATIVAS RESTANTES:

            <span id="numeroTentativas">
                3
            </span>

        </div>


        <!-- STATUS -->

        <div
            class="status"
            id="status"
            role="status"
            aria-live="polite"
        >
            DIGITE A SENHA
        </div>


        <!-- ======================================
             ALTERAR SENHA
        ======================================= -->

        <a
            href="senha.html"
            class="botao-config"
            id="botaoConfig"
            rel="noopener noreferrer"
        >
            ⚙ ALTERAR SENHA
        </a>

    </section>

</main>


<!--
    JavaScript somente do próprio servidor.
    O CSP impede scripts externos.
-->
<script
    src="script.js"
    defer
></script>
```

</body>

</html>
